name: Fabric sync

on:
  schedule:
    # 04:00 UTC = 07:00 Київ (літній час) / 06:00 (зимовий)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуску'
        type: choice
        default: dry-run
        options:
          - supplier-only            # лише перевірити сайти постачальників
          - inspect                  # показати товари і варіанти в Shopify
          - create-variants-dry-run  # показати, які варіанти буде створено
          - create-variants          # створити варіанти тканин у товарах
          - dry-run                  # синхронізація наявності — пробно
          - live                     # синхронізація наявності — реально
          - photos-supplier          # взяти фото тканин з сайту постачальника → photos/
          - photos-upload            # завантажити фото в Shopify і прив'язати до варіантів
          # (вимкнено поки що) photos-prepare / photos-generate — генерація Nano Banana, див. src/photos.mjs
      product:
        description: 'Товар (key з config/products.json; порожньо = всі; для photos-* обов''язково, якщо товарів кілька)'
        type: string
        required: false
      only:
        description: 'Лише ці SKU через кому (порожньо = всі)'
        type: string
        required: false

permissions:
  contents: write   # щоб зберегти data/state.json (історію цін)

concurrency:
  group: fabric-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRODUCT: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # За розкладом — реальна синхронізація; вручну — обраний режим
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && '1' || '0' }}
          SUPPLIER_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'supplier-only' && '1' || '0' }}
        if: ${{ github.event_name == 'schedule' || !(contains(fromJSON('["inspect","create-variants-dry-run","create-variants"]'), inputs.mode) || startsWith(inputs.mode, 'photos-')) }}
        run: node src/sync.mjs

      - name: Variants
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["inspect","create-variants-dry-run","create-variants"]'), inputs.mode) }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MODE: ${{ inputs.mode == 'inspect' && 'inspect' || 'create' }}
          DRY_RUN: ${{ inputs.mode == 'create-variants-dry-run' && '1' || '0' }}
        run: node src/variants.mjs

      - name: Photos
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'photos-') }}
        timeout-minutes: 30
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode == 'photos-upload' && 'upload' || inputs.mode == 'photos-supplier' && 'supplier' || inputs.mode == 'photos-prepare' && 'prepare' || 'generate' }}
          ONLY: ${{ inputs.only }}
        run: node src/photos.mjs

      - name: Download pack for Google Flow
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'photos-prepare' }}
        uses: actions/upload-artifact@v4
        with:
          name: photos-prepare
          path: prepare/
          retention-days: 7

      - name: Save state & photos
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain data/ photos/ 2>/dev/null)" ]; then
            git config user.name "fabric-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/ photos/ 2>/dev/null || git add data/
            git commit -m "chore: sync ${{ inputs.mode || 'schedule' }} $(date -u +%F)"
            git pull --rebase
            git push
          fi
